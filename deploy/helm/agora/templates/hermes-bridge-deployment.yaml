{{/* Hermes Bridge - optional, connects Hermes agents to Agora Coordinator */}}
{{- if .Values.hermesBridge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agora.fullname" . }}-hermes-bridge
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hermes-bridge
  template:
    metadata:
      labels:
        {{- include "agora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hermes-bridge
    spec:
      containers:
        - name: hermes-bridge
          image: "{{ .Values.hermesBridge.image.repository }}:{{ .Values.hermesBridge.image.tag }}"
          imagePullPolicy: {{ .Values.hermesBridge.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: AGORA_COORDINATOR_URL
              value: "http://{{ include "agora.coordinator.fullname" . }}:{{ .Values.service.port }}"
            - name: AGORA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agora.fullname" . }}-secrets
                  key: jwtSecret
                  optional: true
          {{- with .Values.hermesBridge.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
