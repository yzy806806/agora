{{/* Postgres - embedded single-instance, enabled when no external URL */}}
{{- if and .Values.database.embedded.enabled (not .Values.database.externalUrl) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agora.postgres.fullname" . }}
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "agora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.embedded.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: agora
            - name: POSTGRES_USER
              value: agora
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agora.fullname" . }}-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.database.embedded.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agora", "-d", "agora"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agora", "-d", "agora"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "agora.postgres.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agora.postgres.fullname" . }}
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    {{- include "agora.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agora.postgres.fullname" . }}
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.embedded.storage }}
{{- end }}
