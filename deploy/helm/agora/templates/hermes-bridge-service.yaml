{{/* Hermes Bridge Service */}}
{{- if .Values.hermesBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agora.fullname" . }}-hermes-bridge
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-bridge
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "agora.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-bridge
{{- end }}
