{{/* Secrets for Coordinator: database URL, Redis URL, JWT secret */}}
{{- if or .Values.secrets.databaseUrl .Values.secrets.redisUrl .Values.secrets.jwtSecret .Values.jwtSecret.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agora.fullname" . }}-secrets
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
type: Opaque
data:
  {{- with .Values.secrets.databaseUrl }}
  databaseUrl: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.redisUrl }}
  redisUrl: {{ . | b64enc | quote }}
  {{- end }}
  {{- $jwt := .Values.jwtSecret.value | default .Values.secrets.jwtSecret }}
  {{- with $jwt }}
  jwtSecret: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
