{{/* Redis - embedded single-instance, enabled when no external URL */}}
{{- if and .Values.redis.embedded.enabled (not .Values.redis.externalUrl) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agora.redis.fullname" . }}
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "agora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.embedded.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.embedded.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "agora.redis.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agora.redis.fullname" . }}
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    {{- include "agora.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agora.redis.fullname" . }}
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.embedded.storage }}
{{- end }}
