{{/* PVC for workspace files (local backend) */}}
{{- if and .Values.workspace.persistence.enabled (eq .Values.workspace.storage.backend "local") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agora.fullname" . }}-workspace
  labels:
    {{- include "agora.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.workspace.persistence.storageClass }}
  storageClassName: {{ .Values.workspace.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspace.persistence.size }}
{{- end }}
