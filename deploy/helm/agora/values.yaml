# Agora Coordinator Helm Values
replicaCount: 2

image:
  repository: ghcr.io/yzy806806/agora-coordinator
  tag: "0.14.0"
  pullPolicy: IfNotPresent

coordinator:
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  affinity: null

service:
  type: ClusterIP
  port: 8000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }

config:
  database:
    url: "sqlite:///data/agora.db"
  redis:
    url: ""
  jwtSecret: ""

database:
  # Embedded Postgres (deployed when no external URL)
  embedded:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
    password: ""  # Required when embedded; set via --set or external secret
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
  externalUrl: ""

redis:
  # Embedded Redis (deployed when config.redis.url is empty)
  embedded:
    enabled: true
    image: redis:7-alpine
    storage: 5Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
  externalUrl: ""

ingress:
  enabled: true
  className: nginx
  host: agora.example.com
  tls:
    enabled: true
    secretName: agora-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "AGORA_WS_ROUTE"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"

workspace:
  storage:
    backend: "local"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  s3:
    bucket: ""
    endpoint: ""
    accessKey: ""
    secretKey: ""

jwtSecret:
  existingSecret: ""
  value: ""

secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s

hermesBridge:
  enabled: false
  image:
    repository: ghcr.io/yzy806806/agora-hermes-bridge
    tag: "0.14.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "500m", memory: 256Mi }

serviceAccount:
  create: true
  name: ""

nameOverride: ""
fullnameOverride: ""
