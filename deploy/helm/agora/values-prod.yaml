# Production overrides for Agora Helm Chart
# Usage: helm install agora deploy/helm/agora -f deploy/helm/agora/values-prod.yaml

replicaCount: 3

coordinator:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

# Use external Postgres in production
database:
  embedded:
    enabled: false
  externalUrl: ""  # Set via --set or external secret

# Use external Redis in production
redis:
  embedded:
    enabled: false
  externalUrl: ""  # Set via --set or external secret

# S3 workspace for multi-instance
workspace:
  storage:
    backend: s3
  s3:
    bucket: ""
    endpoint: ""
    accessKey: ""
    secretKey: ""

ingress:
  tls:
    enabled: true

jwtSecret:
  value: ""  # MUST set via --set or external secret

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
