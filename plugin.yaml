author: yzy806806
description: Unified worker model — no leader/worker split. Leader is just a template.
  Heartbeat config lives on the project (not the profile), enabling the same leader
  to manage multiple projects with independent sessions but shared experience.
  Event-driven discussions, per-project kanban boards, human participation, dashboard.
has_api: true
has_dashboard: true
kind: backend
name: agora
provides_hooks:
- kanban_task_completed
- kanban_task_claimed
- kanban_task_blocked
provides_tools:
- agora_raise_motion
- agora_get_messages
- agora_get_result
- agora_list_motions
- agora_start_project
- agora_stop_project
- agora_project_status
- agora_create_worker
- agora_list_workers
- agora_remove_worker
- agora_list_templates
- agora_create_team
- agora_list_teams
- agora_remove_team
version: "0.12.0"
